name: sr-agro-vision
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - torchaudio
  - pytorch-cuda=12.1
  - numpy>=1.24.0
  - pillow>=9.5.0
  - matplotlib>=3.7.0
  - scikit-image>=0.21.0
  - pyyaml>=6.0
  - tqdm>=4.65.0
  - tensorboard>=2.13.0
  # Fase 2: Dependencias satelitales (CDSE)
  - scipy>=1.11.0
  - rasterio>=1.3.0
  - shapely>=2.0.0
  - libgdal-jp2openjpeg  # Plugin para leer archivos JP2 de Sentinel-2
  # Fase 4: Evaluación agrícola
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - joblib>=1.3.0
  - pip
  - pip:
    - opencv-python>=4.8.0
    - python-dotenv>=1.0.0
    - cdse-client>=0.1.0

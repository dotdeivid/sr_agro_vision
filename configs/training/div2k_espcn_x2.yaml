# Config DIV2K - ESPCN x2 (RGB Standard)

model:
  architecture: "ESPCNMultispectral"  # Usar mismo modelo pero con 3 canales
  scale_factor: 2
  num_channels: 3  # RGB
  num_features: 64

data:
  dataset_type: "rgb"  # Nuevo flag
  num_channels: 3
  patch_size: 256
  augmentation: true

training:
  epochs: 100  # Menos que satelital
  batch_size: 16
  learning_rate: 0.001
  lr_scheduler:
    type: "StepLR"
    step_size: 30
    gamma: 0.5
  loss: "L1"
  
  train_lr_data: "data/datasets/train/LR"
  train_hr_data: "data/datasets/train/HR"
  val_lr_data: "data/datasets/val/LR"
  val_hr_data: "data/datasets/val/HR"
  
  checkpoint_dir: "outputs/weights/div2k_espcn_x2"
  log_dir: "outputs/logs/div2k_espcn_x2"
  
  save_every: 10
  validate_every: 5

inference:
  test_dir: "outputs/tests/div2k_espcn_x2"

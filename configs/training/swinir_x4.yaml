# Configuración para entrenamiento satelital x4 con SwinIR

model:
  architecture: "SwinIRMultispectral"
  scale_factor: 4
  num_channels: 4  # RGB + NIR
  embed_dim: 60
  depths: [6, 6, 6, 6]
  num_heads: [6, 6, 6, 6]
  window_size: 8

data:
  dataset_type: "multiespectral"
  num_channels: 4
  patch_size: 128
  augmentation: true

training:
  epochs: 200  # SwinIR necesita más epochs
  batch_size: 4  # Menor porque Transformer usa más memoria
  learning_rate: 0.0002
  lr_scheduler:
    type: "CosineAnnealingLR"
    T_max: 200
  
  loss: "CombinedLoss"  # L1 + Perceptual
  
  # Paths
  train_lr_data: "data/datasets/train/LR"
  train_hr_data: "data/datasets/train/HR"
  val_lr_data: "data/datasets/val/LR"
  val_hr_data: "data/datasets/val/HR"
  
  checkpoint_dir: "outputs/weights/swinir_x4"
  log_dir: "outputs/logs/swinir_x4"
  
  save_every: 10
  validate_every: 5

data:
  num_channels: 4
  patch_size: 128
  augmentation: true

inference:
  test_dir: "outputs/tests/swinir_x4"

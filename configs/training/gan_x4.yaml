# Configuración para entrenamiento GAN satelital x4

model:
  architecture: "ESPCNMultispectral"  # Generator
  scale_factor: 4
  num_channels: 4  # RGB + NIR
  num_features: 64

data:
  dataset_type: "multiespectral"
  num_channels: 4
  patch_size: 128
  augmentation: true

training:
  epochs: 100  # GAN converge más rápido
  batch_size: 8
  learning_rate: 0.0001  # Menor LR para GAN estable
  
  # GAN-specific (no usar lr_scheduler estándar)
  
  # Paths
  train_lr_data: "data/datasets/train/LR"
  train_hr_data: "data/datasets/train/HR"
  val_lr_data: "data/datasets/val/LR"
  val_hr_data: "data/datasets/val/HR"
  
  checkpoint_dir: "outputs/weights/gan_x4"
  log_dir: "outputs/logs/gan_x4"
  
  save_every: 10
  validate_every: 5

data:
  num_channels: 4
  patch_size: 128
  augmentation: true

inference:
  test_dir: "outputs/tests/gan_x4"

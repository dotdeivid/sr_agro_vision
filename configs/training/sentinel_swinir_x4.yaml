# Config Sentinel-2 - SwinIR x4 (Multiespectral)

model:
  architecture: "SwinIR"
  scale_factor: 4
  num_channels: 4  # RGB + NIR
  num_features: 64
  depths: [6, 6, 6, 6]
  num_heads: [6, 6, 6, 6]

data:
  dataset_type: "multiespectral"
  num_channels: 4
  patch_size: 256
  augmentation: true

training:
  epochs: 250
  batch_size: 8
  learning_rate: 0.0002
  lr_scheduler:
    type: "CosineAnnealingLR"
    T_max: 250
  loss: "L1"
  
  train_lr_data: "data/datasets/train/LR"
  train_hr_data: "data/datasets/train/HR"
  val_lr_data: "data/datasets/val/LR"
  val_hr_data: "data/datasets/val/HR"
  
  checkpoint_dir: "outputs/weights/sentinel_swinir_x4"
  log_dir: "outputs/logs/sentinel_swinir_x4"
  
  save_every: 10
  validate_every: 5

inference:
  test_dir: "outputs/tests/sentinel_swinir_x4"

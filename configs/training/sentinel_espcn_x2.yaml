# Config Sentinel-2 - ESPCN x2 (Multiespectral)

model:
  architecture: "ESPCNMultispectral"
  scale_factor: 2
  num_channels: 4  # RGB + NIR
  num_features: 64

data:
  dataset_type: "multiespectral"  # Nuevo flag
  num_channels: 4
  patch_size: 256
  augmentation: true

training:
  epochs: 150  # Más que RGB (dataset más complejo)
  batch_size: 12
  learning_rate: 0.001
  lr_scheduler:
    type: "StepLR"
    step_size: 50
    gamma: 0.5
  loss: "L1"
  
  train_lr_data: "data/datasets/train/LR"
  train_hr_data: "data/datasets/train/HR"
  val_lr_data: "data/datasets/val/LR"
  val_hr_data: "data/datasets/val/HR"
  
  checkpoint_dir: "outputs/weights/sentinel_espcn_x2"
  log_dir: "outputs/logs/sentinel_espcn_x2"
  
  save_every: 10
  validate_every: 5

inference:
  test_dir: "outputs/tests/sentinel_espcn_x2"
